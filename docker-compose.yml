services:
  # -------------------------------------------------------------
  # AICTE SDMS React Frontend (Vite / Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secure-stack-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  # -------------------------------------------------------------
  # Core Spring Boot Application API (Java 21)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secure-stack-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/secure_stack
      POSTGRES_USER: ${POSTGRES_USER:-secure_stack_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
      PROCESSING_SERVICE_URL: http://processing-service:8000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------------------------
  # Python Document Processing & Forensic Verification Microservice
  # -------------------------------------------------------------
  processing-service:
    build:
      context: ./processing-service
      dockerfile: Dockerfile
    container_name: secure-stack-processing-service
    restart: unless-stopped
    ports:
      - "8000:8000"

  # -------------------------------------------------------------
  # PostgreSQL Database (Relational Store & Audit Event Chains)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: secure-stack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secure_stack}
      POSTGRES_USER: ${POSTGRES_USER:-secure_stack_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secure_stack_app} -d ${POSTGRES_DB:-secure_stack}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # MinIO S3-Compatible Object Storage (Secure Deposit Instruments)
  # -------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    container_name: secure-stack-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin_local_only_change_me}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  # -------------------------------------------------------------
  # Redis Cache & Notification Message Broker
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: secure-stack-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  minio_data:
  redis_data:
